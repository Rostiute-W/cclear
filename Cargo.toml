[workspace]
members = ["crates/cclear-core", "src-tauri"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
blake3 = "1.8"
rayon = "1.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = "0.3"
uuid = "1"
windows = "0.62"
tempfile = "3"

[profile.release]
lto = "thin"
